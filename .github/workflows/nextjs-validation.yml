name: Next.js validation

on:
  push:
    branches: [main, hardening/contract-idempotency]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextjs-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Security, tests and Next.js build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Validate TypeScript and build Next.js
        run: npm run build
