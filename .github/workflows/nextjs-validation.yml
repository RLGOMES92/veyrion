name: Segurança, testes e compilação com Next.js

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextjs-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Segurança, testes e compilação com Next.js
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Valores fictícios exclusivos do CI. Nunca são usados em produção.
      NEXT_PUBLIC_SUPABASE_URL: "https://ci-placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-not-a-real-key"
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências travadas
        run: npm ci --no-audit --no-fund

      - name: Executar testes automatizados
        run: npm test

      - name: Auditar dependências
        run: npm audit --audit-level=moderate

      - name: Validar TypeScript e compilar Next.js
        run: npm run build
